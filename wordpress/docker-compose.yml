version: "3.9"

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: database:6033
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - landing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3

  mariadb:
    image: mariadb:latest
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: wordpress_db
    ports:
      - "3360:3306"
    volumes:
      - ./database:/var/lib/mysql
    networks:
      - landing-network
    healthcheck:
      test:
        ["CMD", "mariadb-admin", "ping", "-u", "${MYSQL_USER}", "-p${MYSQL_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  landing-network:
    external: true