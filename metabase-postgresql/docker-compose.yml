version: "3.9"

services:
  server:
    image: metabase/metabase
    container_name: metabase-server
    restart: always
    ports:
      - "3000:3000"
    networks:
      - metabase-network
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=metabase-postgres
      - MB_DB_PORT=metabase
      - MB_DB_DBNAME=value
      - MB_DB_USER=postgres
      - MB_DB_PASS=postgres

  database:
    image: postgres:latest
    container_name: metabase-postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - metabase-database:/var/lib/postgresql/data
    networks:
      - metabase-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metabase

volumes:
  metabase-database:
    external: true

networks:
  metabase-network:
    external: true
