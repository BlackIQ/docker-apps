version: "3"

x-postgres-common: &postgres-common
  restart: always
  networks:
    - psql-net

services:
  node-1:
    <<: *postgres-common
    image: bitnami/postgresql-repmgr:14
    container_name: node-1
    ports:
      - 5432
    volumes:
      - ./data/node-1:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=customuser
      - POSTGRESQL_PASSWORD=custompassword
      - POSTGRESQL_DATABASE=customdatabase
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_FAILOVER=automatic
      - REPMGR_RECONNECT_ATTEMPTS=1
      - REPMGR_RECONNECT_INTERVAL=1

      - REPMGR_PRIMARY_HOST=node-1
      - REPMGR_PARTNER_NODES=node-1,node-2,node-3,node-4,node-5
      - REPMGR_NODE_NAME=node-1
      - REPMGR_NODE_NETWORK_NAME=node-1

  node-2:
    <<: *postgres-common
    image: bitnami/postgresql-repmgr:14
    container_name: node-2
    ports:
      - 5432
    volumes:
      - ./data/node-2:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=customuser
      - POSTGRESQL_PASSWORD=custompassword
      - POSTGRESQL_DATABASE=customdatabase
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_FAILOVER=automatic
      - REPMGR_RECONNECT_ATTEMPTS=1
      - REPMGR_RECONNECT_INTERVAL=1

      - REPMGR_PRIMARY_HOST=node-1
      - REPMGR_PARTNER_NODES=node-1,node-2,node-3,node-4,node-5
      - REPMGR_NODE_NAME=node-2
      - REPMGR_NODE_NETWORK_NAME=node-2

  node-3:
    <<: *postgres-common
    image: bitnami/postgresql-repmgr:14
    container_name: node-3
    ports:
      - 5432
    volumes:
      - ./data/node-3:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=customuser
      - POSTGRESQL_PASSWORD=custompassword
      - POSTGRESQL_DATABASE=customdatabase
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_FAILOVER=automatic
      - REPMGR_RECONNECT_ATTEMPTS=1
      - REPMGR_RECONNECT_INTERVAL=1

      - REPMGR_PRIMARY_HOST=node-1
      - REPMGR_PARTNER_NODES=node-1,node-2,node-3,node-4,node-5
      - REPMGR_NODE_NAME=node-3
      - REPMGR_NODE_NETWORK_NAME=node-3

  node-4:
    <<: *postgres-common
    image: bitnami/postgresql-repmgr:14
    container_name: node-4
    ports:
      - 5432
    volumes:
      - ./data/node-4:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=customuser
      - POSTGRESQL_PASSWORD=custompassword
      - POSTGRESQL_DATABASE=customdatabase
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_FAILOVER=automatic
      - REPMGR_RECONNECT_ATTEMPTS=1
      - REPMGR_RECONNECT_INTERVAL=1

      - REPMGR_PRIMARY_HOST=node-1
      - REPMGR_PARTNER_NODES=node-1,node-2,node-3,node-4,node-5
      - REPMGR_NODE_NAME=node-4
      - REPMGR_NODE_NETWORK_NAME=node-4

  node-5:
    <<: *postgres-common
    image: bitnami/postgresql-repmgr:14
    container_name: node-5
    ports:
      - 5432
    volumes:
      - ./data/node-5:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      - POSTGRESQL_USERNAME=customuser
      - POSTGRESQL_PASSWORD=custompassword
      - POSTGRESQL_DATABASE=customdatabase
      - REPMGR_PASSWORD=repmgrpassword
      - REPMGR_FAILOVER=automatic
      - REPMGR_RECONNECT_ATTEMPTS=1
      - REPMGR_RECONNECT_INTERVAL=1

      - REPMGR_PRIMARY_HOST=node-1
      - REPMGR_PARTNER_NODES=node-1,node-2,node-3,node-4,node-5
      - REPMGR_NODE_NAME=node-5
      - REPMGR_NODE_NETWORK_NAME=node-5

  pgpool:
    <<: *postgres-common
    image: bitnami/pgpool:4
    container_name: pgpool
    ports:
      - 5342:5432
    environment:
      - PGPOOL_BACKEND_NODES=0:node-1:5432,1:node-2:5432,2:node-3:5432,3:node-4:5432,4:node-5:5432
      - PGPOOL_BACKEND_APPLICATION_NAMES=0:node-1:5432,1:node-2:5432,2:node-3:5432,3:node-4:5432,4:node-5:5432
      - PGPOOL_SR_CHECK_USER=customuser
      - PGPOOL_SR_CHECK_PASSWORD=custompassword
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD=adminpassword
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=adminpassword

      - PGPOOL_ENABLE_STATEMENT_LOAD_BALANCING=yes
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_AUTO_FAILBACK=yes

networks:
  psql-net:
