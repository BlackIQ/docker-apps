version: "3.9"

services:
  influx:
    image: influxdb:latest
    container_name: local-influx
    restart: always
    ports:
      - "8068:8086"
    volumes:
      - dbl-influx-data:/var/lib/influxdb2
      - dbl-influx-config:/etc/influxdb2
    networks:
      - database-network
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dbl-influx-data:
  dbl-influx-config:

networks:
  database-network:
