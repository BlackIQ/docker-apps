version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: local-postgres
    restart: always
    ports:
      - "5423:5432"
    volumes:
      - dbl-postgres-data:/var/lib/postgresql/data
    networks:
      - database-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dbl-postgres-data:

networks:
  database-network:
