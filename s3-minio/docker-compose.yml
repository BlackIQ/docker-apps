version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: minio
    volumes:
      - ./s3:/data
    environment:
      MINIO_ROOT_USER: username
      MINIO_ROOT_PASSWORD: strongpassword
    command: server /data --console-address ":9001"
    ports:
      - "10000:9000" # API
      - "10001:9001" # Web
    networks:
      - minio-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  minio-network:
    external: true
