version: "3"

services:
  zabbix-database:
    image: mysql:8.0-oracle
    container_name: zabbix-database
    environment:
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "ZabbiX-Moitoring"
      MYSQL_ROOT_PASSWORD: "StrongPassword123!"
    volumes:
      - zabbix_mysql_data:/var/lib/mysql
    command:
      [
        "--character-set-server=utf8",
        "--collation-server=utf8_bin",
        "--default-authentication-plugin=mysql_native_password",
      ]
    networks:
      - zabbix_network
    restart: always

  zabbix-java-gateway:
    image: zabbix/zabbix-java-gateway:alpine-7.0-latest
    container_name: zabbix-java-gateway
    networks:
      - zabbix_network
    restart: always

  zabbix-server:
    image: zabbix/zabbix-server:alpine-7.0-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: "zabbix-database"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "ZabbiX-Moitoring"
      MYSQL_ROOT_PASSWORD: "StrongPassword123!"
      ZBX_JAVAGATEWAY: "zabbix-java-gateway"
    ports:
      - "10051:10051"
    networks:
      - zabbix_network
    restart: always

  zabbix-webserver:
    image: zabbix/zabbix-webserver:alpine-7.0-latest
    container_name: zabbix-webserver
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      DB_SERVER_HOST: "zabbix-database"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "ZabbiX-Moitoring"
      MYSQL_ROOT_PASSWORD: "StrongPassword123!"
    ports:
      - "8080:8080"
    networks:
      - zabbix_network
    restart: always

volumes:
  zabbix_mysql_data:

networks:
  zabbix_network:
    driver: bridge
