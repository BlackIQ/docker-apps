version: "3.8"

services:
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tehran
      - SERVERURL=home.amirhossein.info
      - SERVERPORT=51820
      - PEERS=client1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    networks:
      - wg-network
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always

networks:
  wg-network:
    external: true
